<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e8f4fd;padding:12px;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:#1a3a5c;min-height:100vh}
.app{max-width:420px;margin:0 auto;background:#fff;border:2px solid #4da6ff;border-radius:16px;overflow:hidden;box-shadow:0 6px 20px rgba(0,102,204,.18)}
.top{display:flex;justify-content:space-between;background:#1a1a2e;color:#7fb1ff;font-family:monospace;font-size:11px;padding:6px 12px}
.hero{background:linear-gradient(135deg,#4da6ff,#0066cc);color:#fff;text-align:center;padding:18px 12px 14px}
.hero .mascot{width:72px;height:72px;border-radius:50%;border:2px solid #fff;background:#fff;object-fit:cover;margin:0 auto 8px;display:block;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.hero h1{font-family:"Mali",cursive,sans-serif;font-size:18px}
.hero p{font-size:11px;opacity:.9;margin-top:2px}
.body{position:relative;margin:10px;border:2px solid #0066cc;border-radius:14px;padding:20px 14px;text-align:center;background:#fff}
.body::before{content:"";position:absolute;inset:6px;border:1.6px dashed #81c7f0;border-radius:10px;pointer-events:none}
.big{font-size:52px}
h2{font-size:15px;color:#0066cc;margin:8px 0 6px;font-family:"Mali",cursive,sans-serif}
p{font-size:12px;color:#4a7a9a;line-height:1.7}
.gamename{font-size:13px;font-weight:800;color:#1a3a5c;margin-top:4px;line-height:1.5;word-break:break-word}
.hostline{margin:10px auto 0;max-width:320px;font-size:11px;color:#4a7a9a;word-break:break-all;background:#e8f4fd;border:1px dashed #81c7f0;border-radius:10px;padding:8px 10px;line-height:1.6}
.hostline b{color:#0a9c4a}
.hostline b.bad{color:#c43c64}
.btns{margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
a.btn{flex:1;min-width:140px;text-align:center;background:linear-gradient(180deg,#4da6ff,#0066cc);color:#fff;padding:10px;border-radius:24px;font-weight:800;font-size:12px;border:2px solid #fff;box-shadow:0 4px 0 #004499;text-decoration:none;font-family:"Mali",cursive,sans-serif}
a.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #004499}
a.btn.ghost{background:#fff;color:#0066cc;border:1.5px solid #81c7f0;box-shadow:none}
.safe{margin-top:10px;font-size:10px;color:#4a7a9a}
#lockBox{margin-top:10px;text-align:left;background:#e8f4fd;border:1px dashed #81c7f0;border-radius:10px;padding:8px 10px}
.lockrow{display:flex;gap:6px;align-items:center;font-size:12px;padding:4px 0;border-bottom:1px dashed #b8d8f8}
.lockrow:last-child{border:none}
.lockrow b{margin-left:auto;white-space:nowrap}
.lockrow small{color:#4a7a9a}
.lockrow.ok{color:#0a9c4a}
.lockrow.bad{color:#c43c64}
.lockrow a{white-space:nowrap}
a.btn.off{opacity:.45;pointer-events:none}
.foot{background:#1a3a5c;color:#b8d8f8;text-align:center;padding:12px;font-size:11px}
.foot a{color:#fff}
</style>

<body>
<div class="app">
<div class="top"><span>◉ JAVA J2ME</span><span id="clock">00:00</span><span>▂▃▅ ⚠️</span></div>
<div class="hero">
<img class="site-logo" src="assets/logo.png" alt="J2ME.VERCEL.APP" width="720" height="287" style="display:block;width:100%;max-width:320px;height:auto;margin:0 auto 8px" decoding="async" fetchpriority="high" onerror="this.style.display='none'">
<img class="mascot" src="assets/anime-girl.png" alt="anime" width="72" height="72" onerror="this.style.display='none'">
<h1>J2ME.VERCEL.APP</h1>
<p>Kho game Java .JAR • Anime</p>
</div>
<div class="body">
<div class="big">⚠️</div>
<h2 data-i18n="go_title">Rời khỏi J2ME?</h2>
<p data-i18n="go_desc">Bạn sắp mở link tải ngoài:</p>
<p class="gamename" id="gname">…</p>
<p class="hostline" id="host" data-i18n="go_checking">Đang kiểm tra vé tải…</p>
<div id="lockBox" style="display:none"></div>
<div class="btns"><a class="btn off" id="go" href="#" data-i18n="go_open">Mở link »</a><a class="btn ghost" href="index.html" data-i18n="go_stay">Ở lại</a></div>
<p class="safe" data-i18n="go_safe">🔒 Chỉ tiếp tục nếu host quen thuộc (drive.google.com, mediafire.com…). Không nhập mật khẩu ở trang lạ.</p>
</div>
<div class="foot"><p>© <span class="js-year">2026</span> J2ME.VERCEL.APP — Anime WAP</p></div>
</div>
<script>
var el=document.getElementById('clock');if(el)el.textContent=new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
(function(){
  function T(k,fb){ try{ if(window.I18N&&window.I18N.T) return window.I18N.T(k,fb); }catch(e){} return fb; }
  // Mọi link tải đều qua đây bằng vé server — KHÔNG đọc URL file từ games.json,
  // không hiện link thật trong source. Vé hết hạn 15 phút, sai gate là vô hiệu.
  var TRUST=['drive.google.com','www.mediafire.com','mediafire.com','github.com','raw.githubusercontent.com','cdn.jsdelivr.net'];
  function root(){try{var p=location.pathname||'/';var i=p.lastIndexOf('/');return i<=0?'':p.slice(0,i);}catch(e){return '';}}
  function fail(t){document.getElementById('host').textContent=t;var b=document.getElementById('go');b.href='#';b.classList.add('off');}
  function rowsHtml(rows){
    return rows.map(function(r){
      var ic=r.pending?'…':(r.ok?'✓':'✗'),cls=r.pending?'':(r.ok?'ok':'bad');
      var pr=r.pending?T('go_checking2','đang kiểm tra...'):(r.has+'/'+r.need);
      return '<div class="lockrow '+cls+'"><span>'+ic+'</span><span>'+r.label+'</span><b>'+pr+'</b>'+(r.ok?'':(r.hint||''))+'</div>';
    }).join('');
  }
  function goRows(gate,appr,sv){
    var rq=(gate&&gate.require)||{},rows=[],mn=0,lk=0,dn=0;
    if(sv){mn=+sv.minutes||0;lk=+sv.likes||0;dn=+sv.completed||0;}
    else{try{mn=stVerifiedMin();}catch(e){} try{lk=stLikes();}catch(e){} try{dn=stDone();}catch(e){}}
    if(rq.minutes!=null)rows.push({need:+rq.minutes,has:mn,ok:mn>=+rq.minutes,pending:false,label:T('go_req_min','Online đủ {n} phút').replace('{n}',rq.minutes),hint:'<small>'+T('go_auto','mở web là tự tính')+'</small>'});
    if(rq.likes!=null)rows.push({need:+rq.likes,has:lk,ok:lk>=+rq.likes,pending:false,label:T('go_req_like','Thích {n} game').replace('{n}',rq.likes),hint:'<a href="'+root()+'/index.html" style="color:#0066cc">'+T('go_likeNow','→ thích ngay')+'</a>'});
    if(rq.completed!=null)rows.push({need:+rq.completed,has:dn,ok:dn>=+rq.completed,pending:false,label:T('go_req_done','Phá đảo {n} game').replace('{n}',rq.completed),hint:'<small>'+T('go_doneHint','bấm "Phá đảo?" ở trang game')+'</small>'});
    if(rq.comments!=null){var pend=(appr==null);rows.push({need:+rq.comments,has:pend?-1:appr,ok:!pend&&appr>=+rq.comments,pending:pend,label:T('go_req_cmt','Có {n} bình luận được duyệt').replace('{n}',rq.comments),hint:'<small>'+T('go_cmtHint','bình luận ở trang game, chờ duyệt')+'</small>'});}
    return rows;
  }
  function passAll(rows){for(var i=0;i<rows.length;i++)if(!rows[i].ok)return false;return true;}
  function boot(){
    var q;
    try{q=new URLSearchParams(location.search);}catch(e){fail(T('go_old','Trình duyệt quá cũ.'));return;}
    var ticket=q.get('ticket');
    if(!ticket){document.getElementById('gname').textContent=T('go_noTicket','Thiếu vé tải');fail(T('go_noTicketMsg','Hãy bấm nút Tải ở trang game để lấy vé mới.'));return;}
    fetch(root()+'/api/meta?ticket='+encodeURIComponent(ticket),{cache:'no-store'}).then(function(r){return r.json().then(function(j){return {st:r.status,j:j};});}).then(function(o){
      if(o.st!==200||!o.j||!o.j.game){fail(o.st===403?T('go_expired','Vé hết hạn hoặc đã đổi điều kiện khóa. Quay lại trang game bấm Tải để lấy vé mới.'):T('go_nocheck','Không kiểm tra được vé lúc này.'));return;}
      var g=o.j.game,hosts=o.j.host||{};
      document.getElementById('gname').textContent=(g.name||g.id)+' ('+o.j.res+')';
      var h=hosts[o.j.res]||'';
      if(!h){fail(T('go_nolink','Chưa có link cho bản này.'));return;}
      var res=o.j.res,ok=TRUST.indexOf(String(h).toLowerCase())>=0;
      document.getElementById('host').innerHTML='Host: <b class="'+(ok?'':'bad')+'">'+h+'</b>'+(ok?' ✓ '+T('go_trusted','tin cậy'):' — '+T('go_strange','lạ, cân nhắc kỹ'));
      var gate=g.gate||{type:'none'};
      var needLogin=(gate.type==='login'||!!gate.login);
      var loggedNow=false; try{loggedNow=stLogged();}catch(e){}
      if(needLogin&&!loggedNow){document.getElementById('gname').textContent=(g.name||g.id)+' ('+o.j.res+')';fail(T('go_loginNeed','Bài này chỉ dành cho thành viên. Hãy đăng nhập rồi bấm Tải lại ở trang game.'));return;}
      function open(){var b=document.getElementById('go');b.href=root()+'/api/dl?ticket='+encodeURIComponent(ticket);b.classList.remove('off');}
      if(!gate.type||gate.type==='none'||gate.type!=='stats'){
        // Vé đã qua kiểm tra proof ở server lúc cấp → mở luôn
        open();return;
      }
      var box=document.getElementById('lockBox');box.style.display='block';
      var hardNow=false; try{hardNow=stLogged();}catch(e){}
      var modeHtml='🔒 <b>'+T('go_notyet','Chưa đủ điều kiện để tải')+'</b><div style="margin-top:4px">';
      var modeFoot=hardNow?'':'<div style="margin-top:4px"><small><a href="'+root()+'/dang-nhap.html" style="color:#0066cc">'+T('li_in','Đăng nhập')+'</a> '+T('go_saveProg','để lưu tiến độ theo tài khoản')+'</small></div>';
      // Đã đăng nhập: lấy số server-side cho hiển thị (server đã kiểm cứng lúc cấp vé)
      function withVals(cb){
        if(!hardNow){cb(null);return;}
        try{fetch(root()+'/api/ustats',{headers:{'Authorization':'Bearer '+stToken()},cache:'no-store'}).then(function(r){return r.json();}).then(function(j){cb(j&&typeof j.minutes==='number'?j:null);}).catch(function(){cb(null);});}catch(e){cb(null);}
      }
      withVals(function(sv){
        var rows0=goRows(gate,null,sv);
        var needCmt=rows0.some(function(r){return r.pending;});
        var headCheck='⏳ <b>'+T('go_checking2','Đang kiểm tra điều kiện...')+'</b><div style="margin-top:4px">';
        var headOk='<div style="text-align:center;color:#0a9c4a;font-weight:800">'+T('go_enough','✓ <b>Đủ điều kiện!</b> Bấm Mở link » để tải.')+'</div>';
        function show(rows){
          if(passAll(rows)){box.innerHTML=headOk;open();}
          else{box.innerHTML=modeHtml+rowsHtml(rows)+'</div>'+modeFoot;fail(T('go_lack','Chưa đủ điều kiện khóa — xem tiến độ bên dưới, cày thêm rồi bấm Tải lại ở trang game.'));}
        }
        if(needCmt){box.innerHTML=headCheck+rowsHtml(rows0)+'</div>';try{stApprovedCount(function(n){show(goRows(gate,n,sv));});}catch(e){show(rows0);}}
        else show(rows0);
      });
    }).catch(function(){fail(T('go_nocheck','Không kiểm tra được vé lúc này.'));});
  }
  if(typeof stMinutes==='function')boot();
  else document.addEventListener('DOMContentLoaded',boot,{once:true});
  // Vẽ lại khi i18n sẵn sàng / đổi ngôn ngữ (vé đọc từ URL nên boot lại an toàn)
  document.addEventListener('i18n-ready',function(){try{if(window.I18N&&I18N.lang&&I18N.lang()!=='vi')boot();}catch(e){}});
})();
</script>
<script>try{document.querySelectorAll('.js-year').forEach(function(el){el.textContent=new Date().getFullYear();});}catch(e){}</script>
<script>
// Stats local cho khóa tải: phút online + lượt thích + phá đảo + tên bình luận
function stGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function stSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function stMinutes(){return Math.floor((+stGet('j2me_online_ms',0))/60000);}
function stPresence(){try{var p=JSON.parse(localStorage.getItem('j2me_presence')||'null');if(p&&typeof p.tok==='string'&&p.tok)return {tok:p.tok,n:Math.max(0,parseInt(p.n||0,10)||0)};}catch(e){}return null;}
function stVerifiedMin(){var pr=stPresence();return pr?pr.n:stMinutes();}
function stLikes(){var a=stGet('j2me_favs',[]);return Array.isArray(a)?a.length:0;}
function stDone(){var a=stGet('j2me_done',[]);return Array.isArray(a)?a.length:0;}
function stNames(){var a=stGet('j2me_names',[]);return Array.isArray(a)?a.filter(Boolean).slice(0,5):[];}
function stSaveName(n){n=String(n||'').trim().slice(0,30);if(n.length<2)return;var a=stNames(),l=n.toLowerCase(),has=false;for(var i=0;i<a.length;i++)if(String(a[i]).toLowerCase()===l)has=true;if(!has){a.push(n);stSet('j2me_names',a.slice(-5));}}
function stApiRoot(){try{var p=location.pathname||'/';var gi=p.indexOf('/game/');return gi>=0?p.slice(0,gi):'';}catch(e){return '';}}
function stToken(){try{var s=JSON.parse(localStorage.getItem('sb_session')||'null');return (s&&s.access_token)||'';}catch(e){return '';}}
function stUid(){try{var t=stToken();if(!t)return '';var p=(t.split('.')[1]||'').replace(/-/g,'+').replace(/_/g,'/');while(p.length%4)p+='=';var j=JSON.parse(atob(p));return j.sub||'';}catch(e){return '';}}
function stLogged(){return !!stToken();}
function stAuthHeaders(){var t=stToken();return t?{'Authorization':'Bearer '+t}:{};}
function stEvent(t,id){try{var tk=stToken();if(!tk)return;fetch(stApiRoot()+'/api/ustats',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+tk},body:JSON.stringify({t:t,id:String(id||'').slice(0,120)}),keepalive:true}).catch(function(){});}catch(e){}}
var _stApprCache={at:0,n:-1};
function stApprovedCount(cb){var now=Date.now();if(_stApprCache.n>=0&&now-_stApprCache.at<60000){cb(_stApprCache.n);return;}var tk='';try{tk=stToken();}catch(e){}var names=stNames();if(!tk&&!names.length){cb(0);return;}var url=stApiRoot()+'/api/comments?mine=1'+(names.length?'&names='+encodeURIComponent(names.join(',')):'');var hh=tk?{'Authorization':'Bearer '+tk}:{};fetch(url,{headers:hh,cache:'no-store'}).then(function(r){return r.json();}).then(function(j){var n=+(j&&j.mine)||0;_stApprCache={at:now,n:n};cb(n);}).catch(function(){cb(_stApprCache.n>=0?_stApprCache.n:0);});}
(function(){try{setInterval(function(){try{if(document.hidden)return;var ms=+localStorage.getItem('j2me_online_ms')||0;localStorage.setItem('j2me_online_ms',String(ms+60000));}catch(e){}try{var tk=stToken();if(tk)fetch(stApiRoot()+'/api/ustats',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+tk},body:JSON.stringify({t:'heartbeat'}),keepalive:true}).catch(function(){});}catch(e){}try{var pr=null;try{pr=JSON.parse(localStorage.getItem('j2me_presence')||'null');}catch(e){}fetch(stApiRoot()+'/api/presence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tok:(pr&&pr.tok)||''}),keepalive:true}).then(function(r){return r.json();}).then(function(j){if(j&&j.tok)try{localStorage.setItem('j2me_presence',JSON.stringify({tok:j.tok,n:j.n||0}));}catch(e){}}).catch(function(){});}catch(e){}},60000);}catch(e){}})();
</script>
