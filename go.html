<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rời khỏi J2ME? - J2ME.VERCEL.APP</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ff4d8d">
<link rel="icon" href="assets/anime-girl.png" type="image/png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff0f6;padding:12px;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:#4a2a3a;min-height:100vh}
.app{max-width:420px;margin:0 auto;background:#fff;border:2px solid #ff8ec7;border-radius:16px;overflow:hidden;box-shadow:0 6px 20px rgba(255,77,141,.18)}
.top{display:flex;justify-content:space-between;background:#1a1a2e;color:#7fb1ff;font-family:monospace;font-size:11px;padding:6px 12px}
.hero{background:linear-gradient(135deg,#ff8ec7,#ff4d8d);color:#fff;text-align:center;padding:18px 12px 14px}
.hero .mascot{width:72px;height:72px;border-radius:50%;border:2px solid #fff;background:#fff;object-fit:cover;margin:0 auto 8px;display:block;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.hero h1{font-family:"Mali",cursive,sans-serif;font-size:18px}
.hero p{font-size:11px;opacity:.9;margin-top:2px}
.body{position:relative;margin:10px;border:2px solid #ff4d8d;border-radius:14px;padding:20px 14px;text-align:center;background:#fff}
.body::before{content:"";position:absolute;inset:6px;border:1.6px dashed #ffb3d9;border-radius:10px;pointer-events:none}
.big{font-size:52px}
h2{font-size:15px;color:#ff4d8d;margin:8px 0 6px;font-family:"Mali",cursive,sans-serif}
p{font-size:12px;color:#8a6a7a;line-height:1.7}
.gamename{font-size:13px;font-weight:800;color:#4a2a3a;margin-top:4px;line-height:1.5;word-break:break-word}
.hostline{margin:10px auto 0;max-width:320px;font-size:11px;color:#8a6a7a;word-break:break-all;background:#fff0f6;border:1px dashed #ffb3d9;border-radius:10px;padding:8px 10px;line-height:1.6}
.hostline b{color:#0a9c4a}
.hostline b.bad{color:#c43c64}
.btns{margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
a.btn{flex:1;min-width:140px;text-align:center;background:linear-gradient(180deg,#ff8ec7,#ff4d8d);color:#fff;padding:10px;border-radius:24px;font-weight:800;font-size:12px;border:2px solid #fff;box-shadow:0 4px 0 #d43a6f;text-decoration:none;font-family:"Mali",cursive,sans-serif}
a.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #d43a6f}
a.btn.ghost{background:#fff;color:#ff4d8d;border:1.5px solid #ffb3d9;box-shadow:none}
.safe{margin-top:10px;font-size:10px;color:#8a6a7a}
.foot{background:#4a1a2e;color:#ffd0e8;text-align:center;padding:12px;font-size:11px}
.foot a{color:#fff}
</style>
</head>
<body>
<div class="app">
<div class="top"><span>◉ JAVA J2ME</span><span id="clock">00:00</span><span>▂▃▅ ⚠️</span></div>
<div class="hero">
<img class="mascot" src="assets/anime-girl.png" alt="anime" width="72" height="72" onerror="this.style.display='none'">
<h1>J2ME.VERCEL.APP</h1>
<p>Kho game Java .JAR • Anime</p>
</div>
<div class="body">
<div class="big">⚠️</div>
<h2>Rời khỏi J2ME?</h2>
<p>Bạn sắp mở link tải ngoài:</p>
<p class="gamename" id="gname">…</p>
<p class="hostline" id="host">Đang kiểm tra link…</p>
<div class="btns"><a class="btn" id="go" href="#">Mở link »</a><a class="btn ghost" href="index.html">Ở lại</a></div>
<p class="safe">🔒 Chỉ tiếp tục nếu host quen thuộc (drive.google.com, mediafire.com…). Không nhập mật khẩu ở trang lạ.</p>
</div>
<div class="foot"><p>© <span class="js-year">2026</span> J2ME.VERCEL.APP — Anime WAP</p></div>
</div>
<script>
var el=document.getElementById('clock');if(el)el.textContent=new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
(function(){
  var TRUST=['drive.google.com','www.mediafire.com','mediafire.com','github.com','raw.githubusercontent.com','cdn.jsdelivr.net'];
  function root(){try{var p=location.pathname||'/';var i=p.lastIndexOf('/');return i<=0?'':p.slice(0,i);}catch(e){return '';}}
  var q=new URLSearchParams(location.search),id=q.get('id'),res=q.get('res');
  function fail(t){document.getElementById('host').textContent=t;document.getElementById('go').href='#';}
  fetch(root()+'/data/games.json',{headers:{Accept:'application/json'}}).then(function(r){return r.json();}).then(function(a){
    var g=null;for(var i=0;i<a.length;i++)if(a[i].id===id)g=a[i];
    var u=g&&(g.jar||{})[res];
    if(!u){document.getElementById('gname').textContent='Link không hợp lệ';fail('Không tìm thấy link tải này.');return;}
    var h='';try{h=new URL(u).hostname;}catch(e){fail('Link lỗi định dạng.');return;}
    var ok=TRUST.indexOf(h.toLowerCase())>=0;
    document.getElementById('gname').textContent=(g.name||id)+' ('+res+')';
    document.getElementById('host').innerHTML='Host: <b class="'+(ok?'':'bad')+'">'+h+'</b>'+(ok?' ✓ tin cậy':' — lạ, cân nhắc kỹ');
    document.getElementById('go').href=u;
  }).catch(function(){fail('Không kiểm tra được link lúc này.');});
})();
</script>
<script>try{document.querySelectorAll('.js-year').forEach(function(el){el.textContent=new Date().getFullYear();});}catch(e){}</script>
</body>
</html>
