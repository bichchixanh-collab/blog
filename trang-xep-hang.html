<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bảng xếp hạng - J2ME.VERCEL.APP</title>
<meta name="description" content="Top game thủ J2ME theo XP — 1 tài khoản 1 phiếu, chống clone bằng database.">
<meta name="theme-color" content="#0066cc">
<link rel="icon" href="assets/anime-girl.png" type="image/png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e8f4fd;padding:12px;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:#1a3a5c;min-height:100vh}
.app{max-width:420px;margin:0 auto;background:#fff;border:2px solid #4da6ff;border-radius:16px;overflow:hidden;box-shadow:0 6px 20px rgba(0,102,204,.18)}
.top{display:flex;justify-content:space-between;background:#1a1a2e;color:#7fb1ff;font-family:monospace;font-size:11px;padding:6px 12px}
.hero{background:linear-gradient(135deg,#4da6ff,#0066cc);color:#fff;text-align:center;padding:18px 12px 14px}
.hero .mascot{width:72px;height:72px;border-radius:50%;border:2px solid #fff;background:#fff;object-fit:cover;margin:0 auto 8px;display:block}
.hero h1{font-family:"Mali",cursive,sans-serif;font-size:18px}
.hero p{font-size:11px;opacity:.9}
.body{position:relative;margin:10px;border:2px solid #4da6ff;border-radius:14px;padding:12px;background:#fff}
.body::before{content:"";position:absolute;inset:6px;border:1.6px dashed #81c7f0;border-radius:10px;pointer-events:none}
.row{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px dashed #b8d8f8;font-size:12px}
.row:last-child{border:none}
.rank{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;background:#e8f4fd;border:1.5px solid #81c7f0;color:#0066cc;flex-shrink:0}
.rank.r1{background:#ffd93d;border-color:#d97706;color:#1a3a5c}
.rank.r2{background:#e5e7eb;border-color:#9ca3af;color:#374151}
.rank.r3{background:#f59e0b;border-color:#b45309;color:#fff}
.row b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:#4a7a9a;font-family:monospace}
#boardMsg{font-size:12px;color:#4a7a9a;text-align:center;padding:12px;line-height:1.7}
.foot{background:#1a3a5c;color:#b8d8f8;text-align:center;padding:12px;font-size:11px}
.foot a{color:#fff}
</style>
<link rel="stylesheet" href="assets/css/manga.css?v=7">
</head>
<body>
<div class="app">
<div class="top"><span>◉ XẾP HẠNG</span><span id="clock">00:00</span><span>🏆 TOP</span></div>
<div class="hero">
<img class="site-logo" src="assets/logo.png" alt="J2ME.VERCEL.APP" width="720" height="287" style="display:block;width:100%;max-width:320px;height:auto;margin:0 auto 8px" decoding="async" fetchpriority="high" onerror="this.style.display='none'">
<img class="mascot" src="assets/anime-girl.png" alt="anime" width="72" height="72" onerror="this.style.display='none'">
<h1>Bảng Xếp Hạng</h1>
<p>Top XP toàn web • 1 tài khoản 1 phiếu</p>
</div>
<div class="body">
<div id="boardList"></div>
<div id="boardMsg">Đang tải…</div>
<p style="margin-top:8px"><a href="index.html" style="font-size:11px">‹ Về trang chủ</a> · <a href="dang-nhap.html" style="font-size:11px">Đăng nhập để lên bảng</a></p>
</div>
<div class="foot"><p>© <span class="js-year">2026</span> J2ME.VERCEL.APP</p></div>
</div>
<script>var el=document.getElementById('clock');if(el)el.textContent=new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});try{document.querySelectorAll('.js-year').forEach(function(x){x.textContent=new Date().getFullYear();});}catch(e){}</script>
<script src="assets/js/sb-config.js"></script>
<script src="assets/js/sb-auth.js"></script>
<script src="assets/js/sb-board.js"></script>
<script>
(function(){
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
  window.SBBoard.board().then(function(rows){
    var box=document.getElementById('boardList'),msg=document.getElementById('boardMsg');
    if(!rows||!rows.length){msg.textContent='Chưa có ai lên bảng — đăng nhập + cày XP để làm người đầu tiên!';return;}
    msg.style.display='none';
    box.innerHTML=rows.map(function(r,i){
      var cls=i===0?'r1':i===1?'r2':i===2?'r3':'';
      var medal=i===0?'👑 ':i===1?'🥈 ':i===2?'🥉 ':'';
      return '<div class="row"><span class="rank '+cls+'">'+(i+1)+'</span><b>'+medal+esc(r.display_name)+'</b><small>'+Number(r.xp||0).toLocaleString('vi-VN')+' XP</small></div>';
    }).join('');
  }).catch(function(){document.getElementById('boardMsg').textContent='Không tải được bảng lúc này.';});
})();
</script>
</body>
</html>
