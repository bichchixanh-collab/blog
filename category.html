<body>
<div class="app">
<div class="top-info"><span>◉ JAVA J2ME</span><span id="clock">00:00</span><span>▂▃▅▇ 100%</span></div>
<header class="header">
<img class="site-logo" src="assets/logo.png" alt="J2ME.VERCEL.APP" width="720" height="287" style="display:block;width:100%;max-width:320px;height:auto;margin:0 auto 8px" decoding="async" fetchpriority="high" onerror="this.style.display='none'"><div class="logo-icon">🔔</div><h1>JAVA.WAP.SH</h1><p data-i18n="cat_sub">Thể loại Game Java</p></header>
<nav class="wap-nav" style="display:flex;gap:6px;overflow:auto;padding:8px 10px;background:#1a3a5c;white-space:nowrap"><a href="index.html" style="color:#b8d8f8;background:rgba(255,255,255,.08);padding:6px 12px;border-radius:20px;font-size:11px;text-decoration:none" data-i18n="nav_home">⌂ Trang chủ</a><a href="category.html" style="background:#fff;color:#0066cc;padding:6px 12px;border-radius:20px;font-size:11px" data-i18n="nav_cat">≡ Thể loại</a></nav>

<div class="wrap">
  <div class="breadcrumb" style="font-size:11px;color:#4a7a9a"><a href="index.html" style="color:#0066cc" data-i18n="foot_home">Trang chủ</a> › <b id="bcCat">Tất cả</b></div>

  <section class="cat-grid" id="catGrid">

<script>
function T(k,fb){ try{ if(window.I18N&&window.I18N.T) return window.I18N.T(k,fb); }catch(e){} return fb; }
function CATKEY(vi){ try{ if(window.I18N&&window.I18N.catName){ var m={'Hành Động':'catn_hanhdong','Nhập Vai':'catn_nhapvai','Đua xe':'catn_duaxe','Bắn súng':'catn_bansung','Trí tuệ':'catn_tritue','Thể thao':'catn_thethao','Phiêu lưu':'catn_phieuluu','Nông trại':'catn_nongtrai','Việt Hóa':'catn_viethoa'}; if(m[vi]) return m[vi]; } }catch(e){} return vi; }
function tick(){const el=document.getElementById('clock');if(el)el.textContent=new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})}tick();setInterval(tick,30000);
const CATS=[
  {id:'Hành Động',icon:'⚔️',color:'#0066cc'},
  {id:'Nhập Vai',icon:'🧙',color:'#a78bfa'},
  {id:'Đua xe',icon:'🏎️',color:'#f59e0b'},
  {id:'Bắn súng',icon:'🔫',color:'#0ea5e9'},
  {id:'Trí tuệ',icon:'🧩',color:'#34d399'},
  {id:'Thể thao',icon:'⚽',color:'#f59e0b'},
  {id:'Phiêu lưu',icon:'🗺️',color:'#8ec8ff'},
  {id:'Nông trại',icon:'🌾',color:'#a3e635'},
  {id:'Việt Hóa',icon:'🇻🇳',color:'#0066cc',filter:'vi'},
];
let GAMES=null;
const CAT_LIMIT=6;
let CAT_PAGE=1, CAT_LIST=[];
async function loadGames(){ if(GAMES) return GAMES; const r=await fetch('data/games.json',{headers:{Accept:'application/json'}}); GAMES=await r.json(); return GAMES; }
function getCat(){ return new URLSearchParams(location.search).get('cat'); }
// Vẽ danh sách game của thể loại đang xem: 6 game/trang
function renderCatPage(){
  const list=document.getElementById('catList'), pager=document.getElementById('catPager');
  if(!list) return;
  const pages=Math.max(1,Math.ceil(CAT_LIST.length/CAT_LIMIT));
  if(CAT_PAGE>pages)CAT_PAGE=pages; if(CAT_PAGE<1)CAT_PAGE=1;
  const cat=getCat()||'', catSafe=escHtml(cat);
  if(!CAT_LIST.length){
    list.innerHTML=`<p style="padding:16px;text-align:center;color:#4a7a9a">${T('cat_empty1','Chưa có game nào cho')} <b>${catSafe}</b> — <a href="admin.php" style="color:#0066cc">${T('cat_empty2','đăng bài ngay')}</a> ♡</p>`;
    if(pager)pager.innerHTML='';
    return;
  }
  list.innerHTML=CAT_LIST.slice((CAT_PAGE-1)*CAT_LIMIT,CAT_PAGE*CAT_LIMIT).map(g=>`
    <a href="game/${escHtml(g.id)}.html" style="display:flex;gap:10px;align-items:center;background:#fff;border:1.5px solid #b8d8f8;border-radius:12px;padding:10px;text-decoration:none">
      <img src="${escHtml(g.thumb)}" width="48" height="48" style="border-radius:10px;border:1.5px solid #b8d8f8;object-fit:cover;flex-shrink:0" alt="${escHtml(g.name)}">
      <div style="flex:1;min-width:0"><b style="font-size:12px;color:#1a3a5c">${escHtml(g.name)} ${(g.gate&&g.gate.type&&g.gate.type!=='none')?'<span style="background:#7a5a00;color:#fff;font-size:8px;padding:1px 4px;border-radius:4px">🔒</span>':''}</b><br><small style="color:#4a7a9a">${escHtml(g.size)} • ${escHtml((g.res||[])[0]||'')}</small></div>
      <span style="background:linear-gradient(180deg,#4da6ff,#0066cc);color:#fff;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:700;border:1.5px solid #fff;white-space:nowrap">${T('dl','⬇ JAR')}</span>
    </a>
  `).join('');
  if(!pager) return;
  if(pages<=1){pager.innerHTML='';return;}
  const btn=function(label,p,dis,cur){return '<button data-cpg="'+p+'" '+(dis?'disabled':'')+' style="background:'+(cur?'#0066cc':'#fff')+';color:'+(cur?'#fff':'#0066cc')+';border:1.5px solid #81c7f0;border-radius:14px;padding:4px 10px;font-size:11px;font-weight:700;cursor:'+(dis?'default':'pointer')+';opacity:'+(dis?'.5':'1')+'">'+label+'</button>';};
  let h=btn('«',CAT_PAGE-1,CAT_PAGE<=1,false);
  for(let p=1;p<=pages;p++){ if(pages>7&&Math.abs(p-CAT_PAGE)>2&&(p!==1&&p!==pages))continue; h+=btn(String(p),p,false,p===CAT_PAGE); }
  h+=btn('»',CAT_PAGE+1,CAT_PAGE>=pages,false);
  pager.innerHTML=h;
  pager.querySelectorAll('[data-cpg]').forEach(function(b){b.onclick=function(){const p=parseInt(b.getAttribute('data-cpg'),10);if(p>=1&&p<=pages&&p!==CAT_PAGE){CAT_PAGE=p;renderCatPage();try{document.getElementById('gameSection').scrollIntoView({block:'start'});}catch(e){}}};});
}
// Chống XSS: escape dữ liệu game + tham số cat trước khi chèn vào HTML
function escHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}

async function render(){
  const games=await loadGames();
  const cat=getCat();
  const grid=document.getElementById('catGrid');
  const bc=document.getElementById('bcCat');
  const section=document.getElementById('gameSection');
  const title=document.getElementById('catTitle');

  // Count per cat
  const counts={};
  games.forEach(g=>{
    counts[g.cat]=(counts[g.cat]||0)+1;
    if(g.vi) counts['Việt Hóa']=(counts['Việt Hóa']||0)+1;
  });

  // Render category grid (CATS là hằng nội bộ, an toàn; hiển thị tên theo ngôn ngữ, link giữ ?cat= gốc)
  grid.innerHTML=CATS.map(c=>{
    const cnt = c.filter==='vi' ? (counts['Việt Hóa']||0) : (counts[c.id]||0);
    return `<a href="category.html?cat=${encodeURIComponent(c.id)}" class="cat-card" style="text-decoration:none">
      <div style="font-size:22px">${c.icon}</div>
      <b>${T(CATKEY(c.id),c.id)}</b><br><small>${cnt} game</small>
    </a>`;
  }).join('') + `<a href="index.html" class="cat-card" style="background:#e8f4fd"><div style="font-size:22px">📚</div><b>${T('cat_allBtn','Tất cả')}</b><br><small>${games.length} game</small></a>`;

  if(cat){
    bc.textContent=cat;
    title.textContent=(CATS.find(c=>c.id===cat)?.icon||'🎮')+' '+cat;
    section.style.display='block';
    if(cat==='Việt Hóa') CAT_LIST=games.filter(g=>g.vi);
    else CAT_LIST=games.filter(g=>g.cat===cat);
    renderCatPage();
    document.title=cat+' - Game Java | J2ME.VERCEL.APP';
    const md=document.querySelector('meta[name="description"]'); if(md) md.content=`Game Java ${cat} hay nhất cho J2ME: tải JAR miễn phí, hỗ trợ 128x160, 240x320.`;
    grid.style.display='none';
  } else {
    bc.textContent=T('cat_all','Tất cả thể loại');
  }
}
render();
// Vẽ lại khi i18n sẵn sàng / đổi ngôn ngữ (chỉ khi đang là ID)
document.addEventListener('i18n-ready',function(){
  try{ if(window.I18N&&I18N.lang&&I18N.lang()!=='vi'){ render(); } }catch(e){}
});
</script>
<script src="assets/i18n.js?v=5"></script>
<button id="liteToggle" title="Tiết kiệm data">📴 Nhẹ</button>
<script>
(function(){function paint(){try{var on=document.documentElement.classList.contains('lite');var b=document.getElementById('liteToggle');if(b)b.textContent=on?'📶 Đủ':'📴 Nhẹ';}catch(e){}}try{var b=document.getElementById('liteToggle');if(b)b.onclick=function(){try{var h=document.documentElement;if(h.classList.contains('lite')){h.classList.remove('lite');localStorage.setItem('j2me_lite','0');}else{h.classList.add('lite');localStorage.setItem('j2me_lite','1');}paint();}catch(e){}};paint();}catch(e){}})();
</script>
<script>try{document.querySelectorAll('.js-year').forEach(function(el){el.textContent=new Date().getFullYear();});}catch(e){}</script>
<script>
// Stats local cho khóa tải: phút online + lượt thích + phá đảo + tên bình luận
function stGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function stSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function stLikes(){var a=stGet('j2me_favs',[]);return Array.isArray(a)?a.length:0;}
function stDone(){var a=stGet('j2me_done',[]);return Array.isArray(a)?a.length:0;}
function stNames(){var a=stGet('j2me_names',[]);return Array.isArray(a)?a.filter(Boolean).slice(0,5):[];}
function stSaveName(n){n=String(n||'').trim().slice(0,30);if(n.length<2)return;var a=stNames(),l=n.toLowerCase(),has=false;for(var i=0;i<a.length;i++)if(String(a[i]).toLowerCase()===l)has=true;if(!has){a.push(n);stSet('j2me_names',a.slice(-5));}}
function stApiRoot(){try{var p=location.pathname||'/';var gi=p.indexOf('/game/');return gi>=0?p.slice(0,gi):'';}catch(e){return '';}}
function stToken(){try{var s=JSON.parse(localStorage.getItem('sb_session')||'null');return (s&&s.access_token)||'';}catch(e){return '';}}
function stUid(){try{var t=stToken();if(!t)return '';var p=(t.split('.')[1]||'').replace(/-/g,'+').replace(/_/g,'/');while(p.length%4)p+='=';var j=JSON.parse(atob(p));return j.sub||'';}catch(e){return '';}}
function stLogged(){return !!stToken();}
function stAuthHeaders(){var t=stToken();return t?{'Authorization':'Bearer '+t}:{};}
function stEvent(t,id){try{var tk=stToken();if(!tk)return;fetch(stApiRoot()+'/api/ustats',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+tk},body:JSON.stringify({t:t,id:String(id||'').slice(0,120)}),keepalive:true}).catch(function(){});}catch(e){}}
var _stApprCache={at:0,n:-1};
function stCid(){try{var c=localStorage.getItem('j2me_cid');if(typeof c==='string'&&/^[0-9a-f]{24}$/.test(c))return c;c='';var ch='0123456789abcdef';for(var i=0;i<24;i++)c+=ch[Math.floor(Math.random()*16)];try{localStorage.setItem('j2me_cid',c);}catch(e){}return c;}catch(e){return '';}}
function stApprovedCount(cb){var now=Date.now();if(_stApprCache.n>=0&&now-_stApprCache.at<60000){cb(_stApprCache.n);return;}var tk='';try{tk=stToken();}catch(e){}var names=stNames();if(!tk&&!names.length){cb(0);return;}var url=stApiRoot()+'/api/comments?mine=1'+(names.length?'&names='+encodeURIComponent(names.join(',')):'');var hh=tk?{'Authorization':'Bearer '+tk}:{};fetch(url,{headers:hh,cache:'no-store'}).then(function(r){return r.json();}).then(function(j){var n=+(j&&j.mine)||0;_stApprCache={at:now,n:n};cb(n);}).catch(function(){cb(_stApprCache.n>=0?_stApprCache.n:0);});}
</script>
